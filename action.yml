name: 'Upload to NexusMC'
description: 'Upload file to NexusMC to update resource'
author: 'mcio-dev'
branding:
  icon: 'upload'
  color: 'blue'

inputs:
  api_token:
    description: 'NexusMC Personal API Token'
    required: true
    type: string
  resource_id:
    description: 'NexusMC Resource ID'
    required: true
    type: string
  file_path:
    description: 'Path to one file to upload (legacy compatible; use files for multiple files)'
    required: false
    type: string
  files:
    description: 'Resource files as JSON array. Each item supports path, isPrimary, subcategoryIds, loaderIds, gameVersions, mcVersions, extractCode, and extra resource file fields.'
    required: false
    type: string
  version:
    description: 'Resource version number'
    required: false
    type: string
  version_title:
    description: 'Version title'
    required: false
    type: string
  changelog:
    description: 'Changelog for the new version'
    required: false
    type: string
  publish_version:
    description: 'Whether to publish as a new version. Omit it when only patching metadata, docs, or tutorials.'
    required: false
    type: boolean
  mc_versions:
    description: 'Supported Minecraft versions (JSON array)'
    required: false
    type: string
  tags:
    description: 'Custom tags (JSON array)'
    required: false
    type: string
  official_tags:
    description: 'Official tags (JSON array)'
    required: false
    type: string
  cover_image_path:
    description: 'Path to cover image file'
    required: false
    type: string
  tutorial_post_ids:
    description: 'Tutorial post IDs (JSON array)'
    required: false
    type: string
  documentation_post_refs:
    description: 'Documentation post references (JSON array)'
    required: false
    type: string
  documentation_url:
    description: 'External documentation URL'
    required: false
    type: string
  dependencies:
    description: 'Dependencies (JSON array)'
    required: false
    type: string
  is_draft:
    description: 'Save as draft. Omit it to leave the current draft/publish state unchanged.'
    required: false
    type: boolean

runs:
  using: 'composite'
  steps:
    - name: Build Upload to NexusMC action
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build

    - name: Run Upload to NexusMC action
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_API_TOKEN: ${{ inputs.api_token }}
        INPUT_RESOURCE_ID: ${{ inputs.resource_id }}
        INPUT_FILE_PATH: ${{ inputs.file_path }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_VERSION_TITLE: ${{ inputs.version_title }}
        INPUT_CHANGELOG: ${{ inputs.changelog }}
        INPUT_PUBLISH_VERSION: ${{ inputs.publish_version }}
        INPUT_MC_VERSIONS: ${{ inputs.mc_versions }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_OFFICIAL_TAGS: ${{ inputs.official_tags }}
        INPUT_COVER_IMAGE_PATH: ${{ inputs.cover_image_path }}
        INPUT_TUTORIAL_POST_IDS: ${{ inputs.tutorial_post_ids }}
        INPUT_DOCUMENTATION_POST_REFS: ${{ inputs.documentation_post_refs }}
        INPUT_DOCUMENTATION_URL: ${{ inputs.documentation_url }}
        INPUT_DEPENDENCIES: ${{ inputs.dependencies }}
        INPUT_IS_DRAFT: ${{ inputs.is_draft }}
      run: node "${{ github.action_path }}/dist/index.js"
